<!doctype html>
<html lang="en">
  <head>
    <title>WAREHOUSE MANAGEMENT SYSTEM</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    
  </head>
  <body style="padding-top: 20%; background:url('https://images.pexels.com/photos/221047/pexels-photo-221047.jpeg?auto=compress&cs=tinysrgb&dpr=3&h=750&w=1260') no-repeat fixed; background-size:cover; background-attachment: fixed;">

    <div class="container text-center bg-dark pt-5 pb-5">

        <h1 class="text-white" style="text-shadow: 1px 1px white;">The System Is Updating... Please Come Back Later</h1>
        <div class="progress mb-2" style="height: 32px;">
            <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>

  </body>

  <script>

    
    function UpdateProgress(){


        $.ajax({
              type: "GET",
              url: "apis/public/get/stockcard-trail/progress",
              headers : { "Auth" : "ad15bfa64cc8c91e83ae0b7257d81547" },
              success: function (response) {
                
                  let req = parseInt(response.required) + 6263;
                  let prg = parseInt(response.progress);
                  let prc = (prg / req) * 100;
  

                  $(".progress-bar").width(`${prc.toFixed(0)}%`);
                  $(".progress-bar").attr("aria-valuenow",prc.toFixed(0));
                  $(".progress-bar").text(`${prc.toFixed(2)} %`);
                  
              }
          }); 


    }

        $(document).ready(function () {
          
          UpdateProgress();

        });
  

      setInterval(UpdateProgress, 1000);


  </script>
</html>
